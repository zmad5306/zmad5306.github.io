<header
  id="site-header"
  class="fixed inset-x-0 top-0 z-50 border-b border-border transition-all"
>
  <nav
    class="site-nav mx-auto flex max-w-5xl items-center justify-between px-5 py-4 transition-all"
    aria-label="Main"
  >
    <a
      href="{{ '/' | relative_url }}"
      class="flex items-baseline gap-2 no-underline hover:no-underline"
    >
      <span class="font-display text-lg font-bold tracking-tight text-text">Zach Maddox</span>
      <span class="hidden font-mono text-xs text-muted sm:inline">// engineer &amp; architect</span>
    </a>

    <div class="flex items-center gap-1">
      <ul id="nav-links" class="hidden items-center gap-1 md:flex">
        {% for link in site.data.navigation %}
        <li>
          <a
            href="{{ link.url | relative_url }}"
            class="nav-link rounded px-3 py-1.5 text-sm text-muted no-underline transition-colors hover:bg-surface-2 hover:text-text hover:no-underline aria-[current=true]:text-link"
            {% if link.anchor %}data-scrollspy="{{ link.anchor }}"{% endif %}
            >{{ link.label }}</a
          >
        </li>
        {% endfor %}
      </ul>

      <button
        id="theme-toggle"
        type="button"
        class="ml-2 inline-flex h-9 w-9 items-center justify-center rounded border border-border text-muted transition-colors hover:border-primary hover:text-text"
        aria-label="Toggle color theme"
      >
        <span class="theme-icon-dark [&_svg]:h-4 [&_svg]:w-4">{% include icons/moon.svg %}</span>
        <span class="theme-icon-light hidden [&_svg]:h-4 [&_svg]:w-4">{% include icons/sun.svg %}</span>
      </button>

      <button
        id="menu-toggle"
        type="button"
        class="ml-1 inline-flex h-9 w-9 items-center justify-center rounded border border-border text-muted transition-colors hover:border-primary hover:text-text md:hidden"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="mobile-menu"
      >
        <span class="menu-icon-open [&_svg]:h-4 [&_svg]:w-4">{% include icons/menu.svg %}</span>
        <span class="menu-icon-close hidden [&_svg]:h-4 [&_svg]:w-4">{% include icons/x.svg %}</span>
      </button>
    </div>
  </nav>
</header>

<!-- Outside <header>: its backdrop-filter would otherwise become the
     containing block for this fixed overlay and collapse it. -->
<div
  id="mobile-menu"
  class="fixed inset-0 z-40 hidden flex-col overflow-y-auto bg-bg pt-[57px] md:hidden"
>
  <ul class="flex flex-col gap-1 px-5 py-6">
    {% for link in site.data.navigation %}
    <li>
      <a
        href="{{ link.url | relative_url }}"
        class="mobile-nav-link block rounded px-3 py-3 font-display text-xl text-text no-underline hover:bg-surface-2 hover:no-underline"
        >{{ link.label }}</a
      >
    </li>
    {% endfor %}
  </ul>
</div>
<!-- spacer so content clears the fixed header -->
<div aria-hidden="true" class="h-[57px]"></div>
