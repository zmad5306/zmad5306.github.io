<section id="education" aria-labelledby="education-title" class="reveal mx-auto max-w-5xl px-5 pt-16 sm:pt-20">
  {% include section-header.html number="09" id="education" title="Education" %}
  <ul class="divide-y divide-border">
    {% for entry in site.data.education %}
    <li class="flex flex-col gap-1 py-4 sm:flex-row sm:items-baseline sm:gap-6">
      <span class="shrink-0 font-mono text-sm text-muted">{{ entry.year }}</span>
      <div>
        <h3 class="text-base">{{ entry.degree }}</h3>
        <p class="mt-0.5 text-sm text-muted">{{ entry.school }} — {{ entry.note }}</p>
      </div>
    </li>
    {% endfor %}
  </ul>
</section>
