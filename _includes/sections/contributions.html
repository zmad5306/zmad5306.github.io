<section id="contributions" aria-labelledby="contributions-title" class="reveal mx-auto max-w-5xl px-5 pt-16 sm:pt-20">
  {% include section-header.html number="06" id="contributions" title="High-Impact Contributions" %}
  <div class="grid gap-4 md:grid-cols-2">
    {% for item in site.data.contributions %}
    <article class="panel panel-hover p-6">
      <h3>{{ item.title }}</h3>
      <p class="mt-2 font-mono text-xs leading-relaxed text-muted">{{ item.stack }}</p>
      <div class="prose-body mt-4 text-sm">{{ item.body | markdownify }}</div>
    </article>
    {% endfor %}
  </div>
</section>
