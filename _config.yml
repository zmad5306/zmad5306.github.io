title: "Zach Maddox"
description: "Software Engineering, Java, Cloud, and Architecture"
url: "https://zachmaddox.dev"
baseurl: ""

author:
  name: "Zach Maddox"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-default.png
  - scope:
      path: "blog"
      type: "posts"
    values:
      layout: post
      author: "Zach Maddox"

exclude:
  - src
  - node_modules
  - package.json
  - package-lock.json
  - tailwind.config.js
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
