<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      /* Set theme before first paint to avoid a flash of wrong theme. */
      (function () {
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.add('js');
      })();
    </script>

    {% seo %}

    <link
      rel="preload"
      href="{{ '/assets/fonts/fraunces-latin-var.woff2' | relative_url }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="{{ '/assets/fonts/inter-latin-var.woff2' | relative_url }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="{{ '/assets/fonts/jetbrains-mono-latin-var.woff2' | relative_url }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}"
    />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="zachmaddox.dev" />
    <link rel="manifest" href="/site.webmanifest" />
    {% feed_meta %}
  </head>
  <body class="bg-bg text-text font-sans">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded focus:bg-primary focus:px-4 focus:py-2 focus:text-white"
      >Skip to content</a
    >

    {% include nav.html %}

    <main id="main">{{ content }}</main>

    {% include footer.html %}

    <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
