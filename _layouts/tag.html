---
layout: default
---

<div class="mx-auto max-w-5xl px-5 pt-12">
  <p class="font-mono text-sm text-primary">
    <a href="{{ '/blog/' | relative_url }}" class="no-underline hover:underline">← Blog</a>
  </p>
  <h1 class="mt-3 text-3xl">
    Tagged <span class="font-mono text-primary">#{{ page.tag }}</span>
  </h1>

  <div class="mt-10 grid gap-4 md:grid-cols-2">
    {% for post in site.tags[page.tag] %}
    {% include post-card.html post=post %}
    {% endfor %}
  </div>
</div>
